[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-api"
version = "1.0.0"
description = "Stable plugin contract for the Engulf binary-wrapper framework"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["cli", "wrapper", "plugins", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_api"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
