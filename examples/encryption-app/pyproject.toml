[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-encryption-example"
version = "0.1.0"
description = "Official launcher for the reusable Engulf encryption example"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "engulf-encryption-example-core>=0.1,<1",
]

[project.scripts]
engulf-encrypt = "engulf_encryption_example:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_encryption_example"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]
